# SachiKheti Nginx Configuration for Single AWS EC2 Instance
# Copy this file to: /etc/nginx/sites-available/sachikheti
# Then link it: sudo ln -s /etc/nginx/sites-available/sachikheti /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain or EC2 Public IP / Elastic IP
    server_name sachikheti.com www.sachikheti.com;

    # Root directory pointing to the React Vite production build
    root /var/www/sachikheti/client/dist;
    index index.html;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Reverse Proxy for Express REST API running on port 5000 via PM2
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
